spring:
  application:
    name: ai-recruitment-agent

  # spring-ai 2.0.0 bug: auto-config Anthropic bind loi vao ThinkingConfigParam khi khoi dong.
  # AnthropicChatModel duoc khai bao thu cong o AnthropicChatModelConfig.
  #
  # OpenAiChatAutoConfiguration bi loai vi ly do khac: starter-model-openai chi dung cho embedding
  # (spring.ai.openai.embedding ben duoi), khong bao gio dung OpenAI lam ChatModel trong du an nay
  # (moi tac vu chat/reasoning deu la Anthropic). Neu khong loai, starter nay tu dong khai them 1
  # bean ChatModel (openAiChatModel) song song voi anthropicChatModel - luc do bat ky cho nao
  # autowire ChatModel/ChatClient.Builder theo kieu (vd ResumeParsingChatClientConfig o D1) se vo
  # NoUniqueBeanDefinitionException vi co 2 ung vien ma khong ben nao @Primary. Phat hien loi nay
  # bang cach chay that ca bo test, khong phai doan truoc.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment
    username: recruitment
    password: recruitment

  jpa:
    hibernate:
      ddl-auto: validate      # KHÔNG đổi sang update — Flyway là nguồn sự thật của schema
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    anthropic:
      # ANTHROPIC_API_KEY duoc doc truc tiep trong AnthropicChatModelConfig, khong qua day.
      chat:
        options:
          model: claude-sonnet-4-6
          temperature: 0.2
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  storage:
    type: local
    local-path: ./uploads
  resume-parsing:
    poll-interval-ms: 5000
    batch-size: 10

logging:
  level:
    org.springframework.ai: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
