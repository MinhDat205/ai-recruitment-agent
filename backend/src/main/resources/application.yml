spring:
  application:
    name: ai-recruitment-agent

  # spring-ai 2.0.0 bug: auto-config Anthropic bind loi vao ThinkingConfigParam khi khoi dong.
  # AnthropicChatModel duoc khai bao thu cong o AnthropicChatModelConfig.
  #
  # OpenAiChatAutoConfiguration bi loai vi ly do khac: starter-model-openai chi dung cho embedding
  # (spring.ai.openai.embedding ben duoi), khong bao gio dung OpenAI lam ChatModel trong du an nay
  # (moi tac vu chat/reasoning deu la Anthropic). Neu khong loai, starter nay tu dong khai them 1
  # bean ChatModel (openAiChatModel) song song voi anthropicChatModel - luc do bat ky cho nao
  # autowire ChatModel/ChatClient.Builder theo kieu (vd ResumeParsingChatClientConfig o D1) se vo
  # NoUniqueBeanDefinitionException vi co 2 ung vien ma khong ben nao @Primary. Phat hien loi nay
  # bang cach chay that ca bo test, khong phai doan truoc.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment
    username: recruitment
    password: recruitment

  jpa:
    hibernate:
      ddl-auto: validate      # KHÔNG đổi sang update — Flyway là nguồn sự thật của schema
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    anthropic:
      # ANTHROPIC_API_KEY duoc doc truc tiep trong AnthropicChatModelConfig, khong qua day.
      chat:
        options:
          model: claude-sonnet-4-6
          temperature: 0.2
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  storage:
    type: local
    local-path: ./uploads
  resume-parsing:
    poll-interval-ms: 5000
    batch-size: 10
  # FR-C05 - trich xuat lai CV schema cu (R-R5) va tinh bu so thang kinh nghiem cho CV v1 (R-E9b, khong
  # goi LLM nen lo lon hon, chu ky thua hon).
  resume-reparse:
    poll-interval-ms: 5000
    batch-size: 10
  resume-experience:
    poll-interval-ms: 30000
    batch-size: 50
  scoring:
    poll-interval-ms: 5000
    batch-size: 10
  aggregation:
    poll-interval-ms: 5000
    batch-size: 10
  explanation:
    poll-interval-ms: 5000
    batch-size: 10
    max-attempts: 3
  notification:
    poll-interval-ms: 5000
    batch-size: 10
    mail-from: noreply@ai-recruitment-agent.local
  # FR-C06 R-N5 (muc 12 L5) - dia chi frontend de ghep lien ket "Xem và trả lời tại:" trong email NEW_MESSAGE.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  job-embedding:
    poll-interval-ms: 5000
    batch-size: 10
  resume-embedding:
    poll-interval-ms: 5000
    batch-size: 10
  candidate-profile-embedding:
    poll-interval-ms: 5000
    batch-size: 10
  # Dot 4 (chore/hardening) - retry-with-backoff cho loi LLM tam thoi (D1, D2) + timeout tuong minh
  # cho ca hai client (ap dung cho ca 4 dich vu Anthropic: D1/D2/D4/F2, xem AnthropicChatModelConfig
  # - CHUNG mot AnthropicChatModel ben duoi nen chi can cau hinh MOT CHO).
  hardening:
    anthropic-timeout-ms: 30000
    openai-timeout-ms: 30000
    llm:
      max-attempts: 3
      # DUNG max-attempts - 1 moc (= 2): lan thu CUOI cung that bai la FAILED ngay, khong co lan
      # cho nao sau no. LlmRetryPolicy validate dieu nay luc khoi dong.
      backoff-ms: 30000,120000
    # Dot 4h - stale-claim reaper (ResumeParsingScheduler/ScoringRunScheduler.reapStaleClaims): 15
    # phut la nguong coi mot ban ghi PROCESSING/RUNNING la "ket" do JVM restart giua chung; chu ky
    # quet rieng 60s, tach khoi poll-interval-ms xu ly chinh.
    stale-timeout-ms: 900000
    reaper-poll-interval-ms: 60000
  # FR-C07 K3 (goi AI dong bo trong request nguoi dung) - R-K3-1: moi lan goi ChatModel toi da 15 s (bao ca cac lan
  # SDK tu thu lai ngam); R-K3-5/L5: executor rieng toi da 8 luong, khong hang doi, het luong -> 503.
  ai-sync:
    attempt-timeout-ms: 15000
    max-concurrent-calls: 8
  # FR-C07 muc 5 / R-K3-9 - tran token dau ra cua RIENG bean messageDraftChatClient (khong dat cho AnthropicChatModel
  # dung chung). 800 ~ ban nhap <= 1200 ky tu tieng Viet + vo JSON, du 30%; 800 token sinh trong 10-13 s < han 15 s.
  message-draft:
    max-output-tokens: 800

  # Dot 5 (chore/hardening) - rate limit (RateLimitFilter, dat sau JwtAuthenticationFilter trong
  # SecurityConfig). Nhom (a) theo IP cho auth (login/register); nhom (b) theo userId cho 3 endpoint
  # ton LLM. max-tracked-keys chan OOM cho kho bucket trong-nho (xem RateLimitBucketStore).
  rate-limit:
    max-tracked-keys: 10000
    auth:
      capacity: 10
      refill-per-minute: 10
    llm-action:
      capacity: 20
      refill-per-minute: 20
    # FR-C06 R-L1 - gui tin nhan (POST M2 hai phia) theo userId, bucket rieng "message:{userId}".
    message:
      capacity: 20
      refill-per-minute: 20
    # FR-C07 R-K3-8 - goi AI dong bo (POST .../messages/ai-draft hai phia) theo userId, bucket rieng "ai-sync:{userId}",
    # dung chung cho moi endpoint K3 ve sau.
    ai-sync:
      capacity: 5
      refill-per-minute: 2

logging:
  level:
    org.springframework.ai: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
