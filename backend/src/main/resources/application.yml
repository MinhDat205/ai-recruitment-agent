spring:
  application:
    name: ai-recruitment-agent
  # Loai bo auto-configuration Anthropic cua Spring AI 2.0.0: no co bug binding
  # 'spring.ai.anthropic.chat.thinking' vao ThinkingConfigParam (class cua Anthropic SDK goc,
  # khong phai POJO chuan) -> InvalidConfigurationPropertyNameException khi khoi dong.
  # AnthropicChatModel duoc khai bao thu cong o AnthropicChatModelConfig (goi y bang code).
  autoconfigure:
    exclude:
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment
    username: recruitment
    password: recruitment
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    # spring.ai.anthropic.* khong con tac dung vi autoconfiguration da bi loai o tren.
    # ANTHROPIC_API_KEY duoc doc truc tiep tu bien moi truong trong AnthropicChatModelConfig.
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  storage:
    type: local
    local-path: ./uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info