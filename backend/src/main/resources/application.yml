spring:
  application:
    name: ai-recruitment-agent
  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment
    username: recruitment
    password: recruitment
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  storage:
    type: local
    local-path: ./uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info