name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        working-directory: backend
        run: ./mvnw --batch-mode clean verify
        env:
          # Test dùng Testcontainers nên không cần DB thật.
          # Key giả để context khởi động được; không gọi API thật trong test.
          ANTHROPIC_API_KEY: dummy-key-for-ci
          OPENAI_API_KEY: dummy-key-for-ci
          JWT_SECRET: ci-secret-not-used-in-production-0123456789abcdef

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
