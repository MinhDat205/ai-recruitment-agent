services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: recruitment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: recruitment-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — trỏ spring.mail.port vào đây
      - "8025:8025"   # Web UI — mở http://localhost:8025 để xem email đã gửi

  minio:
    image: minio/minio:latest
    container_name: recruitment-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
